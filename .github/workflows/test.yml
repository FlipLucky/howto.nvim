name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: nvim ${{ matrix.nvim }}
    runs-on: ubuntu-latest
    # Nightly breaks now and then for reasons outside this plugin: show it, don't turn main red.
    continue-on-error: ${{ matrix.nvim == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        nvim: [v0.10.4, stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - run: nvim --version | head -1
      - run: nvim --clean -l tests/run.lua
